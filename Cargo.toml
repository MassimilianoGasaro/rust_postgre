[package]
name = "rust_postgre"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
# Senza provider crittografico proprio: rustls usa ring, già richiesto da sqlx, jsonwebtoken e
# rcgen. Con "tls-rustls" entrerebbe anche aws-lc-rs e, con due provider, il server HTTPS va
# in panic all'avvio (vedi tests/tls_tests.rs).
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

# Generazione certificati self-signed (solo sviluppo)
rcgen = "0.13"

# Database (TLS con rustls: i Postgres gestiti come Neon richiedono sslmode=require)
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono", "migrate"] }

# Runtime asincrono
tokio = { version = "1", features = ["full"] }

# Variabili d'ambiente
dotenvy = "0.15"

# Serializzazione/deserializzazione JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JWT (JSON Web Token)
jsonwebtoken = "9"

# Hash delle password
bcrypt = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Gestione errori
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CORS (consente l'origine del client Angular)
tower-http = { version = "0.6", features = ["cors"] }

# Parsing XML in streaming (GPX, TCX)
quick-xml = "0.37"

# Parsing FIT (Garmin, Coros)
fitparser = "0.12"

# Lettura di archivi ZIP (test sui file reali, upload nel Task 6)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Hash SHA-256 dei file originali (deduplica e nome di storage)
sha2 = "0.10"
hex = "0.4"

# File temporanei anonimi per gli ZIP annidati (e directory temporanee nei test)
tempfile = "3"

[dev-dependencies]
# Invio di richieste al Router senza aprire socket (ServiceExt::oneshot)
tower = { version = "0.5", features = ["util"] }
# Lettura del corpo delle risposte nei test
http-body-util = "0.1"